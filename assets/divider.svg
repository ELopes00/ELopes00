<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="12" viewBox="0 0 1000 12">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#00f0ff"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></radialGradient>
    <style>.d{animation:run 3.5s ease-in-out infinite alternate}@keyframes run{from{transform:translateX(0)}to{transform:translateX(960px)}}</style>
  </defs>
  <rect x="0" y="5" width="1000" height="2" fill="url(#l)"/>
  <ellipse class="d" cx="20" cy="6" rx="22" ry="6" fill="url(#dot)"/>
</svg>
