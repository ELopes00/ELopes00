<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03040b"/>
      <stop offset="0.55" stop-color="#0a0b24"/>
      <stop offset="1" stop-color="#160a2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b24" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#0a0b24" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="floor"><rect x="0" y="210" width="1200" height="130"/></clipPath>
    <style>
      .title{font:800 76px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:10px}
      .sub{font:500 21px Consolas,'Courier New',monospace;letter-spacing:4px;fill:#9fb3ff}
      .tag{font:600 13px Consolas,'Courier New',monospace;letter-spacing:3px;fill:#00f0ff}
      .g1{animation:g1 4s infinite steps(1)}
      .g2{animation:g2 4s infinite steps(1)}
      @keyframes g1{0%,86%,100%{transform:translate(0,0);opacity:0}88%{transform:translate(-6px,2px);opacity:.85}91%{transform:translate(5px,-2px);opacity:.85}94%{transform:translate(-3px,0);opacity:.6}}
      @keyframes g2{0%,86%,100%{transform:translate(0,0);opacity:0}88%{transform:translate(6px,-2px);opacity:.85}91%{transform:translate(-5px,2px);opacity:.85}94%{transform:translate(3px,0);opacity:.6}}
      .grid{animation:move 1.6s linear infinite}
      @keyframes move{from{transform:translateY(0)}to{transform:translateY(26px)}}
      .scan{animation:scan 5s linear infinite}
      @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(360px)}}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .p{animation:tw 3s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
      .ring{transform-origin:600px 210px;animation:pulse 4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- estrelas -->
  <g fill="#cfe7ff">
    <circle class="p" cx="80" cy="40" r="1.4"/>
    <circle class="p" cx="210" cy="95" r="1" style="animation-delay:.6s"/>
    <circle class="p" cx="340" cy="30" r="1.6" style="animation-delay:1.2s"/>
    <circle class="p" cx="470" cy="70" r="1" style="animation-delay:.3s"/>
    <circle class="p" cx="760" cy="45" r="1.3" style="animation-delay:1.8s"/>
    <circle class="p" cx="880" cy="110" r="1" style="animation-delay:.9s"/>
    <circle class="p" cx="1010" cy="35" r="1.6" style="animation-delay:2.1s"/>
    <circle class="p" cx="1130" cy="85" r="1.1" style="animation-delay:1.5s"/>
    <circle class="p" cx="150" cy="160" r="1" style="animation-delay:2.4s"/>
    <circle class="p" cx="1060" cy="170" r="1" style="animation-delay:.2s"/>
  </g>

  <!-- sol neon -->
  <g class="ring">
    <circle cx="600" cy="210" r="120" fill="url(#sun)" opacity=".35"/>
    <circle cx="600" cy="210" r="120" fill="none" stroke="url(#neon)" stroke-width="2" filter="url(#softglow)"/>
  </g>

  <!-- chão com grade em perspectiva -->
  <rect x="0" y="210" width="1200" height="130" fill="#07061a"/>
  <g clip-path="url(#floor)" stroke="#7c5cff" stroke-width="1.2" opacity=".75">
    <g class="grid">
      <line x1="0" y1="196" x2="1200" y2="196"/><line x1="0" y1="222" x2="1200" y2="222"/>
      <line x1="0" y1="248" x2="1200" y2="248"/><line x1="0" y1="274" x2="1200" y2="274"/>
      <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="326" x2="1200" y2="326"/>
      <line x1="0" y1="352" x2="1200" y2="352"/>
    </g>
    <g stroke="#00f0ff" opacity=".7">
      <line x1="600" y1="210" x2="600" y2="340"/>
      <line x1="600" y1="210" x2="480" y2="340"/><line x1="600" y1="210" x2="720" y2="340"/>
      <line x1="600" y1="210" x2="340" y2="340"/><line x1="600" y1="210" x2="860" y2="340"/>
      <line x1="600" y1="210" x2="180" y2="340"/><line x1="600" y1="210" x2="1020" y2="340"/>
      <line x1="600" y1="210" x2="0" y2="340"/><line x1="600" y1="210" x2="1200" y2="340"/>
      <line x1="600" y1="210" x2="-240" y2="340"/><line x1="600" y1="210" x2="1440" y2="340"/>
    </g>
  </g>
  <rect x="0" y="210" width="1200" height="130" fill="url(#fade)"/>
  <line x1="0" y1="210" x2="1200" y2="210" stroke="url(#neon)" stroke-width="2" filter="url(#softglow)"/>

  <!-- cantos HUD -->
  <g fill="none" stroke="#00f0ff" stroke-width="2" opacity=".8">
    <path d="M24 54 V24 H54"/><path d="M1146 24 H1176 V54"/>
    <path d="M24 286 V316 H54"/><path d="M1176 286 V316 H1146"/>
  </g>
  <text x="62" y="44" class="tag">SYS://ELOPES00</text>
  <text x="1138" y="44" class="tag" text-anchor="end">STATUS: ONLINE <tspan class="cursor">●</tspan></text>

  <!-- nome com glitch -->
  <g text-anchor="middle">
    <text x="600" y="150" class="title g1" fill="#ff2bd6">EZEQUIEL LOPES</text>
    <text x="600" y="150" class="title g2" fill="#00f0ff">EZEQUIEL LOPES</text>
    <text x="600" y="150" class="title" fill="url(#neon)" filter="url(#glow)">EZEQUIEL LOPES</text>
  </g>
  <text x="600" y="196" class="sub" text-anchor="middle">&gt; DEV FULL STACK · SUPORTE DE TI · AUTOMAÇÃO<tspan class="cursor" fill="#00f0ff">_</tspan></text>

  <!-- linha de varredura -->
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#00f0ff" opacity=".12"/>
</svg>
