<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .n{font:600 60px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#f0f6fc;letter-spacing:1px}
      .s{font:400 18px Consolas,'Courier New',monospace;fill:#8b949e;letter-spacing:2px}
      .a{fill:#38bdf8}
      .c{animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}
      .l{transform-origin:600px 0;animation:g 3.2s ease-in-out infinite}
      @keyframes g{0%,100%{transform:scaleX(.35);opacity:.5}50%{transform:scaleX(1);opacity:1}}
      .in{animation:up 1s ease-out both}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    </style>
  </defs>
  <rect width="1200" height="260" fill="#0d1117"/>
  <rect width="1200" height="260" fill="url(#dots)"/>
  <rect width="1200" height="260" fill="url(#fade)"/>
  <g class="in" text-anchor="middle">
    <text x="600" y="128" class="n">Ezequiel Lopes</text>
    <text x="600" y="172" class="s">dev full stack <tspan class="a">/</tspan> suporte de TI <tspan class="a">/</tspan> automação<tspan class="a c">▍</tspan></text>
  </g>
  <rect class="l" x="400" y="200" width="400" height="2" rx="1" fill="url(#line)"/>
</svg>
